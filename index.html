<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Khung đẹp</title>
<style>
  :root{--bg:#0e0f11;--fg:#f2f2ee;--mute:#8d9096;--ok:#3ddc97;--warn:#ffb84d;--line:#2a2c31}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);
    font:16px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  #hint{min-height:52px;padding:12px 16px;font-size:17px;font-weight:600;text-align:center;
    color:var(--warn);transition:color .2s}
  #hint.ok{color:var(--ok)}
  #wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
  #stage{position:relative;width:min(100%,calc((100dvh - 230px) * var(--r,.75)));aspect-ratio:var(--r,.75);background:#000}
  #stage video,#stage canvas{position:absolute;inset:0;width:100%;height:100%}
  #panel{display:none;padding:10px 20px 0;gap:6px;flex-direction:column}
  #panel.on{display:flex}
  #panel label{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--mute)}
  #panel span{width:84px}
  #panel input{flex:1;accent-color:var(--ok)}
  #bar{display:flex;align-items:center;justify-content:space-around;padding:14px 12px 16px}
  button{font:inherit;color:var(--fg);background:none;border:1.5px solid var(--line);border-radius:999px;
    min-width:56px;height:48px;padding:0 16px}
  button.sel{border-color:var(--warn);color:var(--warn)}
  #shot{width:72px;height:72px;border:4px solid var(--fg);background:var(--fg);padding:0}
  #shot:active{transform:scale(.94)}
  #start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;background:var(--bg);text-align:center;padding:24px;z-index:5}
  #start h1{margin:0;font-size:26px}
  #start p{margin:0;color:var(--mute);max-width:30ch}
  #start button{background:var(--ok);color:#06140d;border:0;font-weight:700;height:52px;padding:0 28px}
  #result{position:fixed;inset:0;background:rgba(0,0,0,.94);display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;padding:16px;z-index:6}
  #result.on{display:flex}
  #result img{max-width:100%;max-height:72dvh;border-radius:6px}
  #result p{margin:0;color:var(--mute);text-align:center}
</style>
</head>
<body>

<div id="start">
  <h1>Khung đẹp</h1>
  <p>Hướng camera vào chủ thể, app gợi ý 2 khung hình đẹp hơn.</p>
  <button id="go">Bật camera</button>
  <p id="msg"></p>
</div>

<div id="hint">Đang tải...</div>
<div id="wrap">
  <div id="stage">
    <video id="v" autoplay playsinline muted></video>
    <canvas id="o"></canvas>
  </div>
</div>

<div id="panel">
  <label><span>Độ sáng</span><input id="fb" type="range" min="0.6" max="1.6" step="0.02" value="1"></label>
  <label><span>Tương phản</span><input id="fc" type="range" min="0.6" max="1.6" step="0.02" value="1"></label>
  <label><span>Bão hòa</span><input id="fs" type="range" min="0" max="2" step="0.02" value="1"></label>
</div>

<div id="bar">
  <button id="bA">Khung A</button>
  <button id="bM">Màu</button>
  <button id="shot" aria-label="Chụp"></button>
  <button id="bB">Khung B</button>
  <button id="bF">Lật</button>
</div>

<div id="result">
  <img id="img" alt="Ảnh đã chụp">
  <p>Nhấn giữ vào ảnh, chọn “Lưu vào Ảnh”.</p>
  <button id="close">Chụp tiếp</button>
</div>

<script type="module">
import {FilesetResolver, FaceDetector} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const $ = id => document.getElementById(id);
const v = $("v"), o = $("o"), ctx = o.getContext("2d");
const hint = $("hint");
let detector = null, stream = null, facing = "environment", pick = null, crops = {A:null,B:null};

const clamp = (x,a,b) => Math.min(b, Math.max(a, x));

async function openCamera(){
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({
    video:{facingMode:facing, width:{ideal:1920}, height:{ideal:1080}}, audio:false});
  v.srcObject = stream;
  await new Promise(r => v.onloadedmetadata = r);
  await v.play();
  $("stage").style.setProperty("--r", v.videoWidth / v.videoHeight);
  o.width = v.videoWidth; o.height = v.videoHeight;
}

$("go").onclick = async () => {
  try{
    await openCamera();
    $("start").style.display = "none";
    const fs = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    detector = await FaceDetector.createFromOptions(fs,{
      baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite"},
      runningMode:"VIDEO"});
    loop();
  }catch(e){
    $("msg").textContent = "Không mở được camera. Hãy cho phép camera trong Safari và mở bằng liên kết https.";
  }
};

$("bF").onclick = async () => { facing = facing === "environment" ? "user" : "environment"; await openCamera(); };

/* ---------- Phân tích bố cục ---------- */
function analyse(f){
  // f: khuôn mặt chuẩn hóa 0..1 (cx, cy, w, h)
  const TY = 0.38;                                  // mắt gần đường 1/3 phía trên
  const s = clamp(f.h / 0.28, 0.45, 1);             // cỡ khung cắt gợi ý
  const mk = tx => ({
    s, x: clamp(f.cx - tx * s, 0, 1 - s), y: clamp(f.cy - TY * s, 0, 1 - s)});
  crops = {A: mk(1/3), B: mk(2/3)};

  const tx = f.cx < 0.5 ? 1/3 : 2/3;
  const dx = f.cx - tx, dy = f.cy - TY;
  if (Math.abs(dx) < 0.05 && Math.abs(dy) < 0.07 && f.h > 0.12 && f.h < 0.5) return {ok:true, text:"Bố cục tốt, chụp được rồi"};
  if (f.h < 0.12) return {ok:false, text:"Lại gần chủ thể hơn"};
  if (f.h > 0.5)  return {ok:false, text:"Lùi ra xa một chút"};
  if (Math.abs(dx) >= Math.abs(dy)) return {ok:false, text: dx > 0 ? "Dịch máy sang phải một chút" : "Dịch máy sang trái một chút"};
  return {ok:false, text: dy < 0 ? "Nâng máy lên, chừa thêm chỗ trên đầu" : "Hạ máy xuống một chút"};
}

/* ---------- Vẽ lên màn hình ---------- */
function draw(face, res){
  const W = o.width, H = o.height;
  ctx.clearRect(0,0,W,H);
  ctx.lineWidth = Math.max(1.5, W/500);
  ctx.strokeStyle = "rgba(255,255,255,.35)";
  ctx.beginPath();
  for (const k of [1/3, 2/3]){
    ctx.moveTo(W*k,0); ctx.lineTo(W*k,H); ctx.moveTo(0,H*k); ctx.lineTo(W,H*k);
  }
  ctx.stroke();
  if (!face) return;

  ctx.strokeStyle = res.ok ? "#3ddc97" : "#ffffff";
  ctx.lineWidth = Math.max(2, W/300);
  ctx.strokeRect((face.cx-face.w/2)*W, (face.cy-face.h/2)*H, face.w*W, face.h*H);

  ctx.font = `600 ${Math.round(W/28)}px -apple-system, sans-serif`;
  for (const k of ["A","B"]){
    const c = crops[k]; if (!c) continue;
    ctx.strokeStyle = "#ffb84d";
    ctx.lineWidth = Math.max(2, W/280) * (pick === k ? 1.6 : 1);
    ctx.setLineDash(pick === k ? [] : [W/60, W/90]);
    ctx.strokeRect(c.x*W, c.y*H, c.s*W, c.s*H);
    ctx.setLineDash([]);
    ctx.fillStyle = "#ffb84d";
    ctx.fillText(k, c.x*W + W/70, c.y*H + W/22);
  }
}

let lastT = -1, lastTick = 0;
function loop(now = 0){
  requestAnimationFrame(loop);
  if (now - lastTick < 90 || v.readyState < 2 || v.currentTime === lastT) return; // ~10 khung/giây
  lastTick = now; lastT = v.currentTime;
  const dets = detector.detectForVideo(v, performance.now()).detections;
  let face = null, res = null;
  if (dets.length){
    const b = dets.map(d => d.boundingBox).sort((a,b) => b.width*b.height - a.width*a.height)[0];
    face = {cx:(b.originX + b.width/2)/v.videoWidth, cy:(b.originY + b.height/2)/v.videoHeight,
            w:b.width/v.videoWidth, h:b.height/v.videoHeight};
    res = analyse(face);
    hint.textContent = res.text; hint.className = res.ok ? "ok" : "";
  }else{
    crops = {A:null,B:null};
    hint.textContent = "Chưa thấy chủ thể. Hướng camera vào người."; hint.className = "";
  }
  draw(face, res);
}

/* ---------- Chọn khung, chỉnh màu, chụp ---------- */
const setPick = k => { pick = pick === k ? null : k; $("bA").classList.toggle("sel", pick==="A"); $("bB").classList.toggle("sel", pick==="B"); };
$("bA").onclick = () => setPick("A");
$("bB").onclick = () => setPick("B");
$("bM").onclick = () => $("panel").classList.toggle("on");

const F = {b:$("fb"), c:$("fc"), s:$("fs")};
const applyPreview = () => v.style.filter = `brightness(${F.b.value}) contrast(${F.c.value}) saturate(${F.s.value})`;
Object.values(F).forEach(i => i.oninput = applyPreview);

$("shot").onclick = () => {
  const c = pick && crops[pick];
  const sx = c ? c.x * v.videoWidth  : 0, sy = c ? c.y * v.videoHeight : 0;
  const sw = c ? c.s * v.videoWidth  : v.videoWidth, sh = c ? c.s * v.videoHeight : v.videoHeight;
  const cv = document.createElement("canvas");
  cv.width = Math.round(sw); cv.height = Math.round(sh);
  const g = cv.getContext("2d");
  g.drawImage(v, sx, sy, sw, sh, 0, 0, cv.width, cv.height);

  const b = +F.b.value, k = +F.c.value, s = +F.s.value;
  if (b !== 1 || k !== 1 || s !== 1){
    const im = g.getImageData(0, 0, cv.width, cv.height), d = im.data;
    for (let i = 0; i < d.length; i += 4){
      let r = d[i]*b, gr = d[i+1]*b, bl = d[i+2]*b;
      r = (r-128)*k+128; gr = (gr-128)*k+128; bl = (bl-128)*k+128;
      const y = .299*r + .587*gr + .114*bl;
      d[i] = y + (r-y)*s; d[i+1] = y + (gr-y)*s; d[i+2] = y + (bl-y)*s;
    }
    g.putImageData(im, 0, 0);
  }
  cv.toBlob(bl => { $("img").src = URL.createObjectURL(bl); $("result").classList.add("on"); }, "image/jpeg", 0.95);
};
$("close").onclick = () => $("result").classList.remove("on");
</script>
</body>
</html>
